user  nginx;
worker_processes  auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Maximum allowed upload body size - should be >= MAX_SIZE in .env
    client_max_body_size 10M;

    # Enable gzip compression for text-based responses
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    upstream backend_upstream {
        server backend:8000;
    }

    # Reusable proxy header block (nginx doesn't support include inside location, so the headers are repeated per block
    # - extract with proxy_set_header in a shared location block if using nginx Plus or a map)
    server {
        listen       80;
        server_name  localhost;

        # ------------------------------------------------------------------
        # Frontend static files (HTML, CSS, JS, images)
        #
        # error_page is scoped to this block only (not server-level) so that API locations below keep returning FastAPI's own JSON 404 bodies.
        # Several frontend scripts (e.g. upload.js) branch on a 404 JSON response from /upload to mean "no images yet"
        # - if the error page below applied globally, those calls would get HTML instead of JSON and break.
        # ------------------------------------------------------------------
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ =404;
            error_page 404 /404.html;
        }

        location = /404.html {
            root   /usr/share/nginx/html;
            internal;
        }

        # ------------------------------------------------------------------
        # API - Authentication (register, login, me, change-password, account)
        # Single block covers all current and future /auth/* endpoints.
        # ------------------------------------------------------------------
        location /auth/ {
            proxy_pass http://backend_upstream/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------------
        # API - Admin (stats, user management, lockout control, image management).
        # Covers all /admin/* endpoints — both /admin/users and /admin/images live under this single prefix.
        # Authorization is enforced entirely by the backend (require_admin dependency); nginx does not attempt to gate access here.
        # ------------------------------------------------------------------
        location /admin/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------------
        # API - Upload (POST)
        # ------------------------------------------------------------------
        location /upload/ {
            proxy_pass http://backend_upstream/upload/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API - Image list (GET with query params)
        location /upload {
            proxy_pass http://backend_upstream/upload;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API - File metadata
        location /file_info/ {
            proxy_pass http://backend_upstream/file_info/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API - All images (slideshow)
        location /all_images {
            proxy_pass http://backend_upstream/all_images;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API - Image viewer page (Jinja2 template)
        location /view/ {
            proxy_pass http://backend_upstream/view/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API - Health check
        location /health {
            proxy_pass http://backend_upstream/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------------
        # Swagger UI and OpenAPI schema
        # Without these blocks, /docs and /openapi.json are served as static files by nginx (returning 404) instead of being proxied to FastAPI.
        # ------------------------------------------------------------------
        location /docs {
            proxy_pass http://backend_upstream/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /openapi.json {
            proxy_pass http://backend_upstream/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------------
        # Uploaded images - served directly by nginx from the shared volume (read-only; long-lived cache headers since filenames are unique)
        # ------------------------------------------------------------------
        location /images/ {
            alias /usr/src/app/images/;
            autoindex off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}