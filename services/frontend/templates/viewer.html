<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Detailed Image</title>
    <link rel="icon" type="image/x-icon" href="../base_images/ico/favicon.ico" />
    <script>
    /* Apply saved theme before first CSS paint to prevent flash of wrong theme. */
    (function () {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/viewer.css" />
    <script src="../js/modal.js" defer></script>
    <script src="../js/viewer.js" defer></script>
  <script src="../js/theme.js" defer></script>
  <script src="../js/lang.js" defer></script>
  </head>
  <body>
    <section class="page-container">
      <header class="header-container">
        <!-- Left slot: theme + lang toggles -->
        <div class="header-left-group">
          <button
            class="theme-toggle"
            id="theme-toggle"
            aria-label="Switch theme"
            title="Switch theme"
            type="button"
          ></button>
          <button
            class="lang-toggle"
            id="lang-toggle"
            aria-label="Switch to Ukrainian"
            title="Switch to Ukrainian"
            type="button"
          >UA</button>
        </div>

        <div class="header-title-group">
          <a class="header-link header-title-link" href="/upload.html#images">
            <h1 class="header-title">My Gallery</h1>
          </a>
          <p class="header-subtitle" data-i18n="header.subtitle">
            Upload selfies, memes, or any fun pictures here.
          </p>
        </div>

        <!--
          Admin icon - hidden by default; viewer.js reveals it after GET /auth/me confirms is_admin: true.
        -->
        <div class="header-actions-group">
          <a
            href="../admin.html"
            class="admin-icon-link"
            id="admin-icon-link"
            aria-label="Admin Panel"
            title="Admin Panel"
            hidden
          >
            <div class="admin-icon">
              <svg
                class="admin-icon-svg"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <path
                  d="M12 2L4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linejoin="round"
                />
                <path
                  d="M9 12l2 2 4-4"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
          </a>

          <a
            href="../account.html"
            class="account-icon-link"
            id="account-icon-link"
            aria-label="My Account"
          >
            <div class="account-icon" id="account-icon">
              <svg
                class="account-icon-svg"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2" />
                <path
                  d="M4 20c0-4 3.6-7 8-7s8 3 8 7"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </div>
          </a>
        </div>
      </header>
    </section>

    <main class="main">
      <section class="image">
        <!--
          src is set by viewer.js after fetching /file_info/:filename.
          filename is extracted from window.location.pathname.
        -->
        <img src="" id="imagePreview" class="imagePreview" alt="{{ filename }}" title="{{ filename }}" />
      </section>

      <section class="image-info">
        <h2 class="page-title" data-i18n="viewer.page_title">Image Details</h2>
        <div class="info-card">
          <div class="info-row">
            <span class="info-label" data-i18n="viewer.label.filename">Full Filename:</span>
            <span class="info-value" id="infoFilename"></span>
          </div>
          <div class="info-row">
            <span class="info-label" data-i18n="viewer.label.original_name">Original Name:</span>
            <span class="info-value" id="infoOriginalName"></span>
          </div>
          <div class="info-row">
            <span class="info-label" data-i18n="viewer.label.unique_name">Unique Name:</span>
            <span class="info-value" id="infoUniqueName"></span>
          </div>
          <div class="info-row">
            <span class="info-label" data-i18n="viewer.label.size">File Size:</span>
            <span class="info-value" id="infoFileSize"></span>
          </div>
          <div class="info-row">
            <span class="info-label" data-i18n="viewer.label.type">File Type:</span>
            <span class="info-value" id="infoFileType"></span>
          </div>
          <div class="info-row">
            <span class="info-label" data-i18n="viewer.label.date">Upload Date:</span>
            <span class="info-value" id="infoUploadDate"></span>
          </div>
        </div>

        <div class="actions">
          <button class="action-button" id="copyUrlBtn">
            <span data-i18n="viewer.btn.copy_url">Copy URL</span>
          </button>
          <button class="action-button" id="downloadBtn">
            <span data-i18n="viewer.btn.download">Download</span>
          </button>
          <button class="action-button" id="deleteBtn">
            <span data-i18n="viewer.btn.delete">Delete</span>
          </button>
        </div>
      </section>
    </main>

    <!-- Lightbox overlay -->
    <div id="image-viewer" class="hidden">
      <span class="close-btn" aria-label="Close">&times;</span>
      <div class="viewer-content">
        <img id="viewer-prev" class="viewer-neighbor" alt="" />
        <img id="viewer-image" src="" alt="Preview Image" />
        <img id="viewer-next" class="viewer-neighbor" alt="" />
      </div>
      <button class="nav-btn prev-btn" aria-label="Previous">&#10094;</button>
      <button class="nav-btn next-btn" aria-label="Next">&#10095;</button>
      <button class="fullscreen-btn" aria-label="Fullscreen">&#x26F6;</button>
    </div>
  </body>
</html>
